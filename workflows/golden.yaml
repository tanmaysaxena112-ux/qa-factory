schema: qa.workflow.v1
name: golden
description: >
  Re-proves the platform after any upgrade of Node, Claude Code, Playwright,
  Appium or a model: the full automated suite must pass and every certified
  suite must still catch every seeded fault. Run it before trusting an upgrade.
params:
  project: { required: true, description: "Project with seeded faults, for example demo-shop" }
steps:
  - id: platform-tests
    run: npm run test
    timeout_seconds: 1800
  - id: doctor
    needs: [platform-tests]
    run: qa doctor --offline
  - id: calibrate-api
    needs: [doctor]
    run: qa calibrate --project ${params.project} --surface api
    timeout_seconds: 1200
  - id: calibrate-web
    needs: [doctor]
    run: qa calibrate --project ${params.project} --surface web
    timeout_seconds: 3600
  - id: dashboard
    needs: [calibrate-api, calibrate-web]
    run: qa dashboard --project ${params.project}
