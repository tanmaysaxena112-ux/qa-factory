schema: qa.workflow.v1
name: web-regression
description: >
  Plan, cross-browser execution, re-execution, triage and blind review in
  parallel, report and the QA Lead's release decision for a project's web tests.
max_cost_usd: 8
params:
  project: { required: true, description: Project folder name }
  prd_id: { required: true, description: PRD the release is judged against }
  env: { default: dev, description: dev or uat }
steps:
  - id: check-tests
    run: qa web validate --project ${params.project}

  - id: stage-plan
    needs: [check-tests]
    run: qa stage --to plan projects/${params.project}/prd/${params.prd_id}.md projects/${params.project}/cases projects/${params.project}/web/tests

  - id: plan
    needs: [stage-plan]
    agent: planner
    cwd: ${run.dir}/staged/plan
    prompt: |
      Plan a full regression of the web tests of project ${params.project} on environment ${params.env}. INDEX.txt lists every file.
    output: qa.testplan.v1
    timeout_seconds: 600

  - id: execute
    needs: [plan]
    run: qa web run --project ${params.project} --env ${params.env} --plan ${run.dir}/steps/plan/output.json
    timeout_seconds: 1800

  - id: rerun
    needs: [execute]
    run: qa web rerun --project ${params.project} --env ${params.env}
    timeout_seconds: 1200

  - id: stage-triage
    needs: [rerun]
    run: qa stage --to triage run:web/main projects/${params.project}/prd/${params.prd_id}.md

  - id: triage
    needs: [stage-triage]
    agent: bug-investigator
    cwd: ${run.dir}/staged/triage
    prompt: |
      Triage run ${run.id}. Results are in web/main/results.json with one detail file per test listing each browser's status, errors and evidence files. INDEX.txt lists every file.
    output: qa.triage.v1
    timeout_seconds: 900

  - id: stage-review
    needs: [rerun]
    run: qa stage --to review run:web/main run:web/rerun projects/${params.project}/prd/${params.prd_id}.md projects/${params.project}/cases projects/${params.project}/web/baselines

  - id: review
    needs: [stage-review]
    agent: blind-reviewer
    cwd: ${run.dir}/staged/review
    prompt: |
      Review run ${run.id} against ${params.prd_id}. Results: web/main/results.json. Re-execution: web/rerun/comparison.json. Screenshots are PNG files under web/main/output; the approved visual baselines are under projects/${params.project}/web/baselines. Read the ones you need. INDEX.txt lists every file.
    output: qa.review.v1
    timeout_seconds: 1500

  - id: stage-report
    needs: [triage, review]
    run: qa stage --to report run:web/main/results.json run:web/rerun/comparison.json run:steps/review/output.json run:steps/triage/output.json projects/${params.project}/prd/${params.prd_id}.md

  - id: report
    needs: [stage-report]
    agent: reporter
    cwd: ${run.dir}/staged/report
    prompt: |
      Report on run ${run.id}. Results: web/main/results.json. Re-execution: web/rerun/comparison.json. The reviewer's verdict is steps/review/output.json and the triage is steps/triage/output.json. INDEX.txt lists every file.
    output: qa.report.v1
    timeout_seconds: 600

  - id: qa-lead
    needs: [report]
    gate: qa-lead
    message: Release decision. Read the report, the blind review and the findings.
