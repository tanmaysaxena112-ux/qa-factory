<!doctype html>
<html lang="en" data-fault="">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo Shop</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header><h1>Demo Shop</h1></header>
  <main>
    <section aria-labelledby="catalogue-heading">
      <h2 id="catalogue-heading">Products</h2>
      <ul id="products"></ul>
    </section>
    <section aria-labelledby="cart-heading" id="cart-section">
      <h2 id="cart-heading">Cart</h2>
      <ul id="cart-lines"></ul>
      <p class="empty" id="cart-empty">Your cart is empty.</p>
      <p class="total" id="cart-total" data-testid="cart-total">Total: $0.00</p>
      <p class="error" id="error" role="alert"></p>
    </section>
  </main>
  <script src="/app.js" type="module"></script>
</body>
</html>
