name: demo-shop
description: Local demo cart API used to demonstrate the full QA Factory pipeline
surfaces: [api, web, mobile]
envs:
  dev:
    # The runner starts the app itself on a free port, so every run is isolated.
    local_app:
      command: [node, projects/demo-shop/app/server.js]
      health: /health
      reset: /__reset
      fault_env: DEMO_FAULT
    expected_build: demo-shop-1.0.0
    # The emulator reaches the host's loopback through this address.
    android:
      avd_env: QA_ANDROID_AVD
      host_address: 10.0.2.2
api:
  openapi: api/openapi.yaml
  tests: api/tests
faults: faults/faults.yaml
testdata: knowledge/testdata.yaml
# Non-functional budgets set by the QA Lead. Scans pass only within them.
scans:
  performance:
    pages: [/]
    budgets:
      performance: 0.9
      accessibility: 1.0
      best-practices: 0.9
      largest-contentful-paint-ms: 2500
      total-blocking-time-ms: 200
      cumulative-layout-shift: 0.1
  load:
    vus: 20
    duration: 20s
    requests:
      - { method: GET, path: /products }
      - { method: GET, path: /cart }
    thresholds:
      p95-ms: 300
      error-rate: 0.01
  security:
    paths: [/, /products]
    required_headers: [x-content-type-options, content-security-policy, referrer-policy, x-frame-options]
