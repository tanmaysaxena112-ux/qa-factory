# Seeded fault library. Calibration starts the app once per fault; a healthy
# suite must fail at least once against every fault.
faults:
  - id: wrong-status
    description: Adding an item returns 200 instead of 201
  - id: missing-total
    description: The cart response omits the total
  - id: quantity-off-by-one
    description: A cart line accepts a quantity of 11
  - id: rounding
    description: Line totals carry floating point error instead of exact cents
  - id: no-404
    description: Adding an unknown product succeeds instead of returning 404
  - id: no-stock-check
    description: More items than are in stock can be added
  - id: delete-noop
    description: Removing a line reports success but leaves it in the cart
  - id: ui-total-stale
    surface: web
    description: The page removes a line but does not refresh the total
  - id: ui-no-label
    surface: web
    description: Quantity inputs have no accessible label
  - id: ui-error-hidden
    surface: web
    description: Error responses are not shown to the shopper
  - id: ui-currency
    surface: web
    description: Money is shown as "14.97 USD" instead of "$14.97"
  - id: ui-layout-shift
    surface: web
    description: The product and cart columns swap widths
  - id: ui-unsafe-names
    surface: web
    description: Product names are parsed as markup (the defect behind escape ESC-001)
  - id: ui-tiny-targets
    surface: mobile
    description: Buttons shrink below a comfortable touch size
  - id: ui-text-keypad
    surface: mobile
    description: Quantity fields open the text keyboard instead of the number pad
  - id: ui-currency
    surface: mobile
    description: Money is shown as "14.97 USD" instead of "$14.97"
  - id: ui-total-stale
    surface: mobile
    description: The page removes a line but does not refresh the total
