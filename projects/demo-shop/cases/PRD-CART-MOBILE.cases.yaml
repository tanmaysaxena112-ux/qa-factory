        rejection message.
      - Refresh the Demo Shop page in Chrome.
      - Confirm the reloaded page shows the current server cart (Product A at
        quantity 2), Product C's field back to its default and no rejected
        quantity carried over, and no failure message shown, per PRD-CART-UI
        EC-004.2.
    source: test_designer
