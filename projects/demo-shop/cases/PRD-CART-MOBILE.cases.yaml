  - id: MOB-CART-42
    title: Two individually valid adds that push a line's cumulative quantity above
      10 are rejected with the quantity message
    requirement: REQ-005
    criteria:
      - AC-005.4
    oracle:
      criterion: AC-005.4
      expected: "Failure messages on a phone match PRD-CART-UI AC-006.1 exactly:
        adding a quantity that ... would take the line above 10 shows \"Quantity
        must be a whole number from 1 to 10.\" Existing mobile cases
        (MOB-CART-24, MOB-CART-36) only trigger this via a single out-of-range
        or stock-conflicting request; none isolates the distinct 'cumulative
        total above 10' clause with two individually valid requests and ample
        stock."
    surface: mobile
    technique: decision_table
    preconditions:
      - Server reset via GET /__reset.
      - Catalogue includes Product A with stock well above 10 (e.g. 25).
    steps:
      - Set Product A's quantity field to 6 and tap "Add Product A to cart";
